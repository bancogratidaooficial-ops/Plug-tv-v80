<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G GRATIDÃO V80 V71 COM RESTAURAR</title>
<meta name="theme-color" content="#FFD700">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f0f0f;color:#fff;padding-bottom:120px}
.top{background:#FFD700;color:#000;padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;position:sticky;top:0;z-index:20}
.btnV{width:40px;height:40px;border-radius:50%;border:none;background:#000;color:#FFD700;font-weight:900}
.search{display:flex;gap:8px;padding:10px}
.search input{flex:1;padding:14px;border-radius:14px;border:none;background:#1e1e1e;color:#fff;border:1px solid #333;outline:none}
.btnS{background:#FFD700;border:none;border-radius:14px;padding:0 22px;font-weight:900}
.menuTop{display:flex;gap:8px;padding:10px}
.menuTop button{flex:1;padding:12px;border-radius:22px;border:none;font-weight:900;font-size:12px}
.verde{background:#00E676;color:#000}.branco{background:#fff;color:#000}.amarelo{background:#FFD700;color:#000}
.barraVolta{display:flex;justify-content:space-between;align-items:center;padding:10px}
.btnVolta{background:#2a2a2a;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:900}
.geral{color:#FFD700;font-weight:900}
.barraAdd{display:flex;gap:8px;padding:8px 10px;overflow:auto}
.barraAdd button{padding:10px 14px;border-radius:20px;border:none;font-weight:900;font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr;gap:10px;padding:10px}
.cardFilme{background:#1e1e1e;border-left:4px solid #FFD700;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.cardFilme img{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#111}
.cardInfo{flex:1}.cardBtns{display:flex;gap:6px}.cardBtns button{width:38px;height:38px;border-radius:10px;border:none}
.btnPlay{background:#FFD700}.btnEdit{background:#333;color:#fff}.btnDel{background:#333;color:#fff}
.barraBottom{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;gap:6px;padding:10px;border-top:2px solid #FFD700;overflow:auto;z-index:30}
.barraBottom button{padding:12px 10px;border-radius:22px;border:none;font-weight:900;font-size:10px;white-space:nowrap}
.ads{text-align:center;padding:10px;color:#555;font-size:12px;border-top:1px solid #222;margin-top:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:15px}
.modal.open{display:flex}
.box{background:#1f1f1f;border-radius:20px;padding:18px;width:100%;max-width:380px;border:2px solid #FFD700;max-height:92vh;overflow:auto}
.box h3{color:#FFD700;text-align:center;margin-bottom:10px}
.box input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin:6px 0}
.box label{font-size:11px;color:#FFD700;font-weight:900;margin-top:8px;display:block}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:13px;border-radius:12px;border:none;font-weight:900}
.btnSave{background:#FFD700;color:#000}.btnCancel{background:#333;color:#fff}
.fab{position:fixed;bottom:80px;right:15px;width:56px;height:56px;border-radius:50%;background:#FFD700;border:none;font-size:26px;z-index:25}
</style>
</head>
<body>
<div class="top"><span>G GRATIDÃO V71 🤖</span><span>🤖 IA</span></div>
<div class="search"><input id="busca" placeholder="Pesquisar..."><button class="btnS" onclick="filtrar()">🔍</button></div>
<div class="menuTop">
<button class="verde" onclick="convidar()">📲 Convidar</button>
<button class="branco" onclick="apoiar()">⭐ Apoiar</button>
<button class="amarelo" onclick="ia()">🤖 IA</button>
</div>
<div style="padding:10px"><div style="background:#1e1e1e;height:45px;border-radius:14px;border:1px solid #222"></div></div>
<div class="barraVolta"><button class="btnVolta" onclick="voltar()">⬅️ VOLTAR PARA PASTAS</button><span class="geral">📁 Geral</span></div>
<div class="barraAdd">
<button style="background:#00E676;color:#000" onclick="addVideoCelular()">📱 + VIDEO CELULAR</button>
<button style="background:#42A5F5;color:#fff" onclick="addLink()">🔗 + LINK</button>
<button style="background:#FF9800;color:#000" onclick="addCapa()">🖼️ CAPA</button>
<button style="background:#FFD700;color:#000" onclick="ia()">🤖 IA</button>
</div>
<div id="lista" class="grid"></div>
<div style="text-align:center;padding:15px"><button class="btnVolta" onclick="voltar()">⬅️ VOLTAR PARA PASTAS</button></div>
<div style="padding:10px"><div style="background:#1e1e1e;height:45px;border-radius:14px;border:1px solid #222"></div></div>
<button class="fab" onclick="ia()">🤖</button>
<div class="ads">Publicidade</div>
<div class="barraBottom">
<button style="background:#00E676" onclick="verMemoria()">📱 MEMÓRIA</button>
<button style="background:#42A5F5;color:#fff" onclick="addLink()">🔗 LINK</button>
<button style="background:#FFD700;color:#000" onclick="abrirGenero()">+ GÊNERO</button>
<button style="background:#FF9800" onclick="backup()">💾 BACKUP</button>
<button style="background:#00E676" onclick="restaurarClick()">📥 RESTAURAR</button>
<input type="file" id="inpRestore" accept=".json" style="display:none">
<button style="background:#ff1744;color:#fff" onclick="resetar()">🗑️ RESET</button>
</div>
<div id="mVideo" class="modal"><div class="box"><h3>📱 + VIDEO CELULAR</h3><input id="vNome" placeholder="Nome: Rambo"><label>📸 CAPA da galeria:</label><input type="file" id="vCapaFile" accept="image/*"><img id="vCapaPrev" style="width:100%;height:120px;object-fit:cover;border-radius:12px;display:none;margin:6px 0"><label>🎥 VÍDEO da memória:</label><input type="file" id="vVideoFile" accept="video/*"><video id="vVideoPrev" controls style="display:none;height:140px;margin:6px 0;width:100%"></video><div id="vInfo" style="font-size:10px;color:#888"></div><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="salvarVideo()">Salvar Blindado</button></div></div></div>

<div id="mGen" class="modal"><div class="box"><h3>📁 + GÊNERO</h3><input id="gNome" placeholder="Nome"><input id="gIco" placeholder="Ícone 🐉"><label>Capa:</label><input type="file" id="gCapaFile" accept="image/*"><img id="gCapaPrev" style="width:100%;height:120px;object-fit:cover;border-radius:12px;display:none"><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="salvarGen()">Criar</button></div></div></div>

<div id="mLink" class="modal"><div class="box"><h3>🔗 + LINK</h3><input id="lNome" placeholder="Nome filme"><input id="lUrl" placeholder="https://..."><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="salvarLink()">Salvar</button></div></div></div>

<div id="mPlayer" class="modal"><div class="box"><h3 id="pTit">Player</h3><video id="player" controls style="width:100%;height:220px;background:#000;border-radius:12px"></video><div id="pInfo" style="font-size:11px;color:#888;margin-top:6px"></div><div class="row"><button class="btnCancel" onclick="fecharPlayer()">Fechar</button></div></div></div>

<div id="mEdit" class="modal"><div class="box"><h3>✏️ Renomear</h3><input id="eNome"><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="confirmEdit()">Salvar</button></div></div></div>
<script>
const KEY='G_V80_V71_FIX';
let dados={categorias:[{nome:'Geral',icone:'📁',capa:'',filmes:[]}],atual:0};
let editIdx=-1;

function carregar(){
 try{
  let keys=[KEY,'G_V71_BLINDADA_V79','G_V71','G_GRATIDAO_V71','ggratidaoV71','G_V78_VIDEO','G_V77_VIP_BLINDADO'];
  for(let k of keys){
   let s=localStorage.getItem(k);
   if(s){ let j=JSON.parse(s); if(j.categorias && j.categorias.length>0 && j.categorias[0].filmes){ dados=j; if(typeof dados.atual==='undefined') dados.atual=0; return; }
   }
  }
 }catch(e){}
 dados={categorias:[{nome:'Geral',icone:'📁',capa:'',filmes:[]}],atual:0};
}
carregar();

function salvar(){
 let json=JSON.stringify(dados);
 try{
  localStorage.setItem(KEY, json);
  localStorage.setItem('G_V71', json);
  localStorage.setItem('G_GRATIDAO_V71', json);
  localStorage.setItem('ggratidaoV71', json);
  sessionStorage.setItem(KEY, json);
 }catch(err){
  // se muito grande, salva sem vídeos grandes mas não apaga
  let copia=JSON.parse(json);
  copia.categorias.forEach(c=>c.filmes.forEach(f=>{ if(f.video && f.video.length>100000) f.video='GRANDE_SALVO_IDB'; }));
  try{ localStorage.setItem(KEY, JSON.stringify(copia)); }catch(e){}
  alert('Vídeo muito grande, salvando capa. Use vídeos menores que 30MB');
 }
 render();
}

function render(){
 let cat=dados.categorias[dados.atual];
 if(!cat){ dados.atual=0; cat=dados.categorias[0]; }
 let el=document.getElementById('lista');
 if(!el) return;
 if(cat.filmes.length==0){
  el.innerHTML='<div style="text-align:center;color:#666;padding:30px">Nenhum filme - clique + VIDEO CELULAR<br><br>Se tinha filmes e sumiu, clique em 📥 RESTAURAR</div>';
  return;
 }
 el.innerHTML=cat.filmes.map((f,i)=>`
  <div class="cardFilme">
   ${f.capa?`<img src="${f.capa}">`:`<div style="width:60px;height:60px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center">🎬</div>`}
   <div style="flex:1"><b>🎬 ${f.titulo}</b><br><small style="color:#888">${f.info||'local • com capa'}</small></div>
   <div class="cardBtns"><button class="btnPlay" onclick="playFilme(${i})">▶️</button><button class="btnEdit" onclick="editar(${i})">✏️</button><button class="btnDel" onclick="apagar(${i})">🗑️</button></div>
  </div>
 `).join('');
}

function toB64(file,cb){ let r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(file); }
document.getElementById('vCapaFile').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f)return; toB64(f,b=>{ let im=document.getElementById('vCapaPrev'); im.src=b; im.style.display='block'; im.dataset.b64=b; }); });
document.getElementById('vVideoFile').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f)return;
 document.getElementById('vInfo').innerText=f.name+' '+(f.size/1024/1024).toFixed(1)+'MB';
 let url=URL.createObjectURL(f); let v=document.getElementById('vVideoPrev'); v.src=url; v.style.display='block';
 toB64(f,b=>{ v.dataset.b64=b; });
});
document.getElementById('gCapaFile').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f)return; toB64(f,b=>{ let im=document.getElementById('gCapaPrev'); im.src=b; im.style.display='block'; im.dataset.b64=b; }); });

function addVideoCelular(){ document.getElementById('vNome').value=''; document.getElementById('vCapaPrev').style.display='none'; document.getElementById('vCapaPrev').dataset.b64=''; document.getElementById('vVideoPrev').style.display='none'; document.getElementById('vVideoPrev').dataset.b64=''; document.getElementById('vInfo').innerText=''; document.getElementById('mVideo').classList.add('open'); }
function salvarVideo(){
 let n=document.getElementById('vNome').value.trim()||'Filme';
 let capa=document.getElementById('vCapaPrev').dataset.b64||'';
 let video=document.getElementById('vVideoPrev').dataset.b64||'';
 if(!capa &&!video) return alert('Escolha capa ou vídeo!');
 dados.categorias[dados.atual].filmes.push({titulo:n,capa:capa,video:video,link:'local',info:'local • com capa'+(video?' • vídeo':'')});
 salvar(); fechar(); alert('✅ Salvo! Agora não some mais!');
}
function addCapa(){ addVideoCelular(); }
function abrirGenero(){ document.getElementById('gNome').value=''; document.getElementById('gIco').value=''; document.getElementById('gCapaPrev').style.display='none'; document.getElementById('mGen').classList.add('open'); }
function salvarGen(){ let n=document.getElementById('gNome').value.trim(); if(!n) return alert('Nome'); let ic=document.getElementById('gIco').value||'📁'; let capa=document.getElementById('gCapaPrev').dataset.b64||''; dados.categorias.push({nome:n,icone:ic,capa:capa,filmes:[]}); dados.atual=dados.categorias.length-1; salvar(); fechar(); }
function addLink(){ document.getElementById('lNome').value=''; document.getElementById('lUrl').value=''; document.getElementById('mLink').classList.add('open'); }
function salvarLink(){ let n=document.getElementById('lNome').value.trim(); let u=document.getElementById('lUrl').value.trim(); if(!n||!u) return alert('Preencha'); dados.categorias[dados.atual].filmes.push({titulo:n,capa:'',video:'',link:u,info:'link'}); salvar(); fechar(); }
function playFilme(i){
 let f=dados.categorias[dados.atual].filmes[i];
 document.getElementById('pTit').innerText=f.titulo;
 let p=document.getElementById('player');
 if(f.video && f.video!='GRANDE_SALVO_IDB'){ p.src=f.video; document.getElementById('mPlayer').classList.add('open'); p.play(); }
 else if(f.link && f.link!='local'){ window.open(f.link,'_blank'); }
 else alert('Só capa salva. Adicione vídeo menor que 30MB');
}
function fecharPlayer(){ document.getElementById('player').pause(); document.getElementById('mPlayer').classList.remove('open'); }
function editar(i){ editIdx=i; document.getElementById('eNome').value=dados.categorias[dados.atual].filmes[i].titulo; document.getElementById('mEdit').classList.add('open'); }
function confirmEdit(){ let n=document.getElementById('eNome').value.trim(); if(!n) return; dados.categorias[dados.atual].filmes[editIdx].titulo=n; salvar(); fechar(); }
function apagar(i){ if(confirm('Apagar '+dados.categorias[dados.atual].filmes[i].titulo+'?')){ dados.categorias[dados.atual].filmes.splice(i,1); salvar(); } }
function voltar(){ dados.atual=0; salvar(); }
function filtrar(){ let q=document.getElementById('busca').value.toLowerCase(); let cat=dados.categorias[dados.atual]; if(!q) return render(); let f=cat.filmes.filter(x=>x.titulo.toLowerCase().includes(q)); document.getElementById('lista').innerHTML=f.map((f,i)=>`<div class="cardFilme"><img src="${f.capa||''}"><div style="flex:1"><b>${f.titulo}</b></div><button class="btnPlay" onclick="playFilme(${i})">▶️</button></div>`).join(''); }
function fechar(){ document.querySelectorAll('.modal').forEach(m=>{ if(m.id!='mPlayer') m.classList.remove('open'); }); }
function verMemoria(){ let tot=dados.categorias.reduce((a,c)=>a+c.filmes.length,0); alert(`💾 MEMÓRIA V80\nGêneros: ${dados.categorias.length}\nFilmes: ${tot}\n\nSalvo blindado em 4 lugares`); }
function backup(){
 let b=new Blob([JSON.stringify(dados)],{type:'application/json'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='G-V71-BACKUP-'+Date.now()+'.json'; a.click();
 alert('✅ Backup baixado! Se sumir, clique em RESTAURAR');
}
function restaurarClick(){ document.getElementById('inpRestore').click(); }
document.getElementById('inpRestore').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader();
 r.onload=()=>{
  try{
   let j=JSON.parse(r.result);
   if(j.categorias){
    if(confirm(`Restaurar backup com ${j.categorias.reduce((a,c)=>a+c.filmes.length,0)} filmes?`)){
     dados=j; if(typeof dados.atual==='undefined') dados.atual=0; salvar(); alert('✅ Restaurado com sucesso!');
    }
   } else alert('Arquivo não é backup G Gratidão');
  }catch(err){ alert('Erro ao ler backup: '+err.message); }
 };
 r.readAsText(f);
});
function resetar(){ if(confirm('RESET? Faça backup!')&&confirm('Apagar TUDO mesmo?')){ localStorage.clear(); location.reload(); } }
function convidar(){ window.open('https://wa.me/?text='+encodeURIComponent('G Gratidão V71 '+location.href),'_blank'); }
function apoiar(){ alert('PIX bancogratidao.oficial@gmail.com'); }
function ia(){ alert('🤖 V80 - V71 com botão RESTAURAR funcionando!'); }

render();
</script>
</body>
</html>
