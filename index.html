<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G GRATIDÃO V81 FIX PASTA AÇÃO</title>
<meta name="theme-color" content="#FFD700">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f0f0f;color:#fff;padding-bottom:120px}
.top{background:#FFD700;color:#000;padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;position:sticky;top:0;z-index:20}
.search{display:flex;gap:8px;padding:10px}
.search input{flex:1;padding:14px;border-radius:14px;background:#1e1e1e;color:#fff;border:1px solid #333;outline:none}
.btnS{background:#FFD700;border:none;border-radius:14px;padding:0 22px;font-weight:900}
.menuTop{display:flex;gap:8px;padding:10px}
.menuTop button{flex:1;padding:12px;border-radius:22px;border:none;font-weight:900;font-size:12px}
.verde{background:#00E676}.branco{background:#fff}.amarelo{background:#FFD700}
.barraVolta{display:flex;justify-content:space-between;align-items:center;padding:10px}
.btnVolta{background:#2a2a2a;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:900}
.geral{color:#FFD700;font-weight:900}
.barraAdd{display:flex;gap:8px;padding:8px 10px;overflow:auto}
.barraAdd button{padding:10px 14px;border-radius:20px;border:none;font-weight:900;font-size:12px;white-space:nowrap}
.gridPastas{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.cardPasta{background:#1e1e1e;border-radius:20px;padding:12px;border:1px solid #2a2a2a;position:relative;min-height:150px;text-align:center}
.cardPasta.lixeira{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#111;border:1px solid #ff1744;color:#ff1744}
.cardPasta.icone{font-size:50px;margin:10px 0}
.cardPasta.nome{font-weight:900}
.cardPasta.sub{color:#888;font-size:11px}
.btnAbrir{background:#FFD700;color:#000;width:100%;padding:9px;border:none;border-radius:10px;font-weight:900;margin-top:8px}
.gridFilmes{display:grid;grid-template-columns:1fr;gap:10px;padding:10px}
.cardFilme{background:#1e1e1e;border-left:4px solid #FFD700;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.cardFilme img{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#111}
.cardBtns{display:flex;gap:6px}.cardBtns button{width:36px;height:36px;border-radius:8px;border:none}
.btnPlay{background:#FFD700}.btnEdit{background:#333;color:#fff}.btnDel{background:#333;color:#fff}
.barraBottom{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;gap:6px;padding:10px;border-top:2px solid #FFD700;overflow:auto;z-index:30}
.barraBottom button{padding:11px 10px;border-radius:22px;border:none;font-weight:900;font-size:10px;white-space:nowrap}
.ads{text-align:center;padding:10px;color:#555;font-size:12px;border-top:1px solid #222;margin-top:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:15px}
.modal.open{display:flex}
.box{background:#1f1f1f;border-radius:20px;padding:18px;width:100%;max-width:380px;border:2px solid #FFD700;max-height:92vh;overflow:auto}
.box h3{color:#FFD700;text-align:center;margin-bottom:10px}
.box input,.box select{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin:6px 0}
.box label{font-size:11px;color:#FFD700;font-weight:900;margin-top:8px;display:block}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:13px;border-radius:12px;border:none;font-weight:900}
.btnSave{background:#FFD700;color:#000}.btnCancel{background:#333;color:#fff}
.fab{position:fixed;bottom:80px;right:15px;width:56px;height:56px;border-radius:50%;background:#FFD700;border:none;font-size:26px;z-index:25}
</style>
</head>
<body>
<div class="top"><span>G GRATIDÃO V81 FIX 🤖</span><span>🤖 IA</span></div>
<div class="search"><input id="busca" placeholder="Pesquisar pasta..."><button class="btnS" onclick="filtrar()">🔍</button></div>
<div class="menuTop">
<button class="verde" onclick="convidar()">📲 Convidar</button>
<button class="branco" onclick="apoiar()">⭐ Apoiar</button>
<button class="amarelo" onclick="ia()">🤖 IA</button>
</div>
<div class="barraVolta"><button class="btnVolta" id="btnVolta" onclick="voltarPastas()">⬅️ VOLTAR PARA PASTAS</button><span class="geral" id="txtGeral">📁 Pastas</span></div>
<div class="barraAdd" id="barraAdd">
<button style="background:#00E676" onclick="addVideoCelular()">📱 + VIDEO CELULAR</button>
<button style="background:#42A5F5;color:#fff" onclick="addLink()">🔗 + LINK</button>
<button style="background:#FF9800" onclick="addCapa()">🖼️ CAPA</button>
<button style="background:#FFD700" onclick="ia()">🤖 IA</button>
</div>
<div id="listaPastas" class="gridPastas"></div>
<div id="listaFilmes" class="gridFilmes" style="display:none"></div>
<button class="fab" onclick="ia()">🤖</button>
<div class="ads">Publicidade</div>
<div class="barraBottom">
<button style="background:#00E676" onclick="verMemoria()">📱 MEMÓRIA</button>
<button style="background:#42A5F5;color:#fff" onclick="addLink()">🔗 LINK</button>
<button style="background:#FFD700" onclick="abrirGenero()">+ GÊNERO</button>
<button style="background:#FF9800" onclick="backup()">💾 BACKUP</button>
<button style="background:#00E676" onclick="restaurarClick()">📥 RESTAURAR</button>
<input type="file" id="inpRestore" accept=".json" style="display:none">
<button style="background:#ff1744;color:#fff" onclick="resetar()">🗑️ RESET</button>
</div>
<div id="mVideo" class="modal"><div class="box"><h3>📱 + VIDEO CELULAR</h3><label>Pasta destino:</label><select id="vDestino"></select><input id="vNome" placeholder="Nome: Rambo"><label>📸 Capa da galeria:</label><input type="file" id="vCapaFile" accept="image/*"><img id="vCapaPrev" style="width:100%;height:120px;object-fit:cover;border-radius:12px;display:none;margin:6px 0"><label>🎥 Vídeo da memória:</label><input type="file" id="vVideoFile" accept="video/*"><video id="vVideoPrev" controls style="display:none;height:140px;width:100%;margin:6px 0"></video><div id="vInfo" style="font-size:10px;color:#888"></div><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="salvarVideo()">Salvar na Pasta</button></div></div></div>

<div id="mGen" class="modal"><div class="box"><h3>📁 + NOVA PASTA</h3><input id="gNome" placeholder="Ex: Ação"><input id="gIco" placeholder="Ícone: 💥 (ou deixe vazio)"><label>Capa da pasta (opcional):</label><input type="file" id="gCapaFile" accept="image/*"><img id="gCapaPrev" style="width:100%;height:120px;object-fit:cover;border-radius:12px;display:none"><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="salvarGen()">Criar Pasta</button></div></div></div>

<div id="mLink" class="modal"><div class="box"><h3>🔗 + LINK</h3><label>Pasta destino:</label><select id="lDestino"></select><input id="lNome" placeholder="Nome filme"><input id="lUrl" placeholder="https://..."><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="salvarLink()">Salvar na Pasta</button></div></div></div>

<div id="mPlayer" class="modal"><div class="box"><h3 id="pTit">Player</h3><video id="player" controls style="width:100%;height:220px;background:#000;border-radius:12px"></video><div class="row"><button class="btnCancel" onclick="fecharPlayer()">Fechar</button></div></div></div>

<div id="mEdit" class="modal"><div class="box"><h3>✏️ Renomear</h3><input id="eNome"><div class="row"><button class="btnCancel" onclick="fechar()">Cancelar</button><button class="btnSave" onclick="confirmEdit()">Salvar</button></div></div></div>
<script>
const KEY='G_V81_FIX_PASTA';
let dados={categorias:[],atual:-1};
let editIdx=-1, editTipo='';

function carregar(){
 try{
  let keys=[KEY,'G_V80_V71_FIX','G_V71_BLINDADA_V79','G_V71','G_GRATIDAO_V71','ggratidaoV71'];
  for(let k of keys){
   let s=localStorage.getItem(k);
   if(s){ let j=JSON.parse(s); if(j.categorias && j.categorias.length>0){ dados=j; if(typeof dados.atual==='undefined') dados.atual=-1; return; }
   }
  }
 }catch(e){}
 dados={categorias:[
  {nome:'Geral',icone:'📁',capa:'',filmes:[]},
  {nome:'Ação',icone:'💥',capa:'',filmes:[]},
  {nome:'Dragon Ball',icone:'🐉',capa:'',filmes:[]}
 ],atual:-1};
}
carregar();

function salvar(){
 try{
  let json=JSON.stringify(dados);
  localStorage.setItem(KEY, json);
  localStorage.setItem('G_V71', json);
  localStorage.setItem('G_GRATIDAO_V71', json);
  localStorage.setItem('ggratidaoV71', json);
 }catch(e){ alert('Memória cheia - faça backup e apague vídeos grandes'); }
 render();
}

function render(){
 let listaPastas=document.getElementById('listaPastas');
 let listaFilmes=document.getElementById('listaFilmes');
 let btnVolta=document.getElementById('btnVolta');
 let txtGeral=document.getElementById('txtGeral');
 let barraAdd=document.getElementById('barraAdd');

 if(dados.atual===-1){
  // MOSTRA TODAS AS PASTAS - INCLUINDO AÇÃO
  btnVolta.style.display='none';
  txtGeral.innerText='📁 Pastas ('+dados.categorias.length+')';
  barraAdd.style.display='none';
  listaFilmes.style.display='none';
  listaPastas.style.display='grid';
  let q=document.getElementById('busca').value.toLowerCase();
  let cats=dados.categorias.filter(c=>!q || c.nome.toLowerCase().includes(q));
  listaPastas.innerHTML=cats.map(c=>{
   let realIdx=dados.categorias.indexOf(c);
   let capaHtml=c.capa?`<img src="${c.capa}" style="width:100%;height:80px;object-fit:cover;border-radius:10px">`:`<div class="icone">${c.icone||'📁'}</div>`;
   return `<div class="cardPasta">
    <button class="lixeira" onclick="apagarPasta(${realIdx})">🗑️</button>
    ${capaHtml}
    <div class="nome">${c.nome}</div>
    <div class="sub">${c.filmes.length} filmes</div>
    <button class="btnAbrir" onclick="entrarPasta(${realIdx})">📁 ABRIR</button>
    <button onclick="renomearPasta(${realIdx})" style="background:#333;color:#fff;border:none;padding:5px 8px;border-radius:8px;font-size:10px;margin-top:4px;width:100%">✏️ Renomear</button>
   </div>`;
  }).join('') + `<div class="cardPasta" style="border:2px dashed #FFD700;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:150px" onclick="abrirGenero()"><div style="font-size:40px">+</div><div style="font-weight:900;color:#FFD700">Criar Pasta Ação</div></div>`;
 } else {
  // DENTRO DA PASTA - MOSTRA FILMES
  let cat=dados.categorias[dados.atual];
  btnVolta.style.display='block';
  txtGeral.innerText='📁 '+cat.nome;
  barraAdd.style.display='flex';
  listaPastas.style.display='none';
  listaFilmes.style.display='grid';
  if(cat.filmes.length==0){
   listaFilmes.innerHTML=`<div style="text-align:center;color:#666;padding:30px">Nenhum filme em ${cat.nome}<br><br>Clique em 📱 + VIDEO CELULAR<br>para adicionar da memória do celular</div>`;
  } else {
   listaFilmes.innerHTML=cat.filmes.map((f,i)=>`
    <div class="cardFilme">
     ${f.capa?`<img src="${f.capa}">`:`<div style="width:60px;height:60px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center">🎬</div>`}
     <div style="flex:1"><b>🎬 ${f.titulo}</b><br><small style="color:#888">${f.info||'local'}</small></div>
     <div class="cardBtns"><button class="btnPlay" onclick="playFilme(${i})">▶️</button><button class="btnEdit" onclick="editarFilme(${i})">✏️</button><button class="btnDel" onclick="apagarFilme(${i})">🗑️</button></div>
    </div>`).join('');
  }
 }
}

function toB64(file,cb){ let r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(file); }
document.getElementById('vCapaFile').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f)return; toB64(f,b=>{ let im=document.getElementById('vCapaPrev'); im.src=b; im.style.display='block'; im.dataset.b64=b; }); });
document.getElementById('vVideoFile').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f)return;
 document.getElementById('vInfo').innerText=f.name+' '+(f.size/1024/1024).toFixed(1)+'MB';
 let url=URL.createObjectURL(f); let v=document.getElementById('vVideoPrev'); v.src=url; v.style.display='block';
 toB64(f,b=>{ v.dataset.b64=b; });
});
document.getElementById('gCapaFile').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f)return; toB64(f,b=>{ let im=document.getElementById('gCapaPrev'); im.src=b; im.style.display='block'; im.dataset.b64=b; }); });

function entrarPasta(idx){ dados.atual=idx; salvar(); }
function voltarPastas(){ dados.atual=-1; salvar(); }

function abrirGenero(){
 document.getElementById('gNome').value=''; document.getElementById('gIco').value=''; let im=document.getElementById('gCapaPrev'); im.style.display='none'; im.dataset.b64='';
 document.getElementById('mGen').classList.add('open');
}
function salvarGen(){
 let n=document.getElementById('gNome').value.trim();
 if(!n) return alert('Digite nome da pasta: Ex: Ação');
 let ic=document.getElementById('gIco').value||'📁';
 let capa=document.getElementById('gCapaPrev').dataset.b64||'';
 dados.categorias.push({nome:n,icone:ic,capa:capa,filmes:[]});
 dados.atual=dados.categorias.length-1;
 salvar(); fechar();
 alert('✅ Pasta '+n+' criada! Agora aparece na tela inicial');
}

function preencherDestinos(){
 let html=dados.categorias.map((c,i)=>`<option value="${i}">${c.nome}</option>`).join('');
 document.getElementById('vDestino').innerHTML=html;
 document.getElementById('lDestino').innerHTML=html;
 if(dados.atual>=0){ document.getElementById('vDestino').value=dados.atual; document.getElementById('lDestino').value=dados.atual; }
}
function addVideoCelular(){
 preencherDestinos();
 document.getElementById('vNome').value=''; document.getElementById('vCapaPrev').style.display='none'; document.getElementById('vCapaPrev').dataset.b64=''; document.getElementById('vVideoPrev').style.display='none'; document.getElementById('vVideoPrev').dataset.b64=''; document.getElementById('vInfo').innerText='';
 document.getElementById('mVideo').classList.add('open');
}
function salvarVideo(){
 let dest=parseInt(document.getElementById('vDestino').value);
 let n=document.getElementById('vNome').value.trim()||'Filme';
 let capa=document.getElementById('vCapaPrev').dataset.b64||'';
 let video=document.getElementById('vVideoPrev').dataset.b64||'';
 if(!capa &&!video) return alert('Escolha capa ou vídeo!');
 dados.categorias[dest].filmes.push({titulo:n,capa:capa,video:video,link:'local',info:'local • com capa'});
 dados.atual=dest;
 salvar(); fechar(); alert('✅ Salvo na pasta '+dados.categorias[dest].nome+'!');
}
function addCapa(){ addVideoCelular(); }
function addLink(){
 preencherDestinos();
 document.getElementById('lNome').value=''; document.getElementById('lUrl').value='';
 document.getElementById('mLink').classList.add('open');
}
function salvarLink(){
 let dest=parseInt(document.getElementById('lDestino').value);
 let n=document.getElementById('lNome').value.trim();
 let u=document.getElementById('lUrl').value.trim();
 if(!n||!u) return alert('Preencha');
 dados.categorias[dest].filmes.push({titulo:n,capa:'',video:'',link:u,info:'link'});
 dados.atual=dest;
 salvar(); fechar();
}

function playFilme(i){
 let f=dados.categorias[dados.atual].filmes[i];
 document.getElementById('pTit').innerText=f.titulo;
 let p=document.getElementById('player');
 if(f.video){ p.src=f.video; document.getElementById('mPlayer').classList.add('open'); p.play(); }
 else if(f.link && f.link!='local'){ window.open(f.link,'_blank'); }
 else alert('Sem vídeo');
}
function fecharPlayer(){ document.getElementById('player').pause(); document.getElementById('mPlayer').classList.remove('open'); }
function editarFilme(i){ editIdx=i; editTipo='filme'; document.getElementById('eNome').value=dados.categorias[dados.atual].filmes[i].titulo; document.getElementById('mEdit').classList.add('open'); }
function renomearPasta(i){ editIdx=i; editTipo='pasta'; document.getElementById('eNome').value=dados.categorias[i].nome; document.getElementById('mEdit').classList.add('open'); }
function confirmEdit(){
 let n=document.getElementById('eNome').value.trim(); if(!n) return;
 if(editTipo==='filme') dados.categorias[dados.atual].filmes[editIdx].titulo=n;
 else dados.categorias[editIdx].nome=n;
 salvar(); fechar();
}
function apagarFilme(i){ if(confirm('Apagar '+dados.categorias[dados.atual].filmes[i].titulo+'?')){ dados.categorias[dados.atual].filmes.splice(i,1); salvar(); } }
function apagarPasta(i){
 if(dados.categorias.length<=1) return alert('Deixe 1 pasta');
 if(confirm('Apagar pasta '+dados.categorias[i].nome+' com '+dados.categorias[i].filmes.length+' filmes?')){
  dados.categorias.splice(i,1); dados.atual=-1; salvar();
 }
}
function voltar(){ voltarPastas(); }
function filtrar(){ render(); }
function fechar(){ document.querySelectorAll('.modal').forEach(m=>{ if(m.id!='mPlayer') m.classList.remove('open'); }); }
function verMemoria(){ let tot=dados.categorias.reduce((a,c)=>a+c.filmes.length,0); alert(`💾 V81 FIX PASTA\nPastas: ${dados.categorias.length}\nFilmes: ${tot}\n\nAção agora aparece!`); }
function backup(){ let b=new Blob([JSON.stringify(dados)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='G-V81-PASTAS-'+Date.now()+'.json'; a.click(); alert('Backup com todas as pastas!'); }
function restaurarClick(){ document.getElementById('inpRestore').click(); }
document.getElementById('inpRestore').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{ try{ let j=JSON.parse(r.result); if(j.categorias){ dados=j; dados.atual=-1; salvar(); alert('✅ Restaurado! Pastas: '+j.categorias.length); } }catch(err){ alert('Erro backup'); } }; r.readAsText(f);
});
function resetar(){ if(confirm('RESET? Faça backup!')&&confirm('Apagar TUDO?')){ localStorage.clear(); location.reload(); } }
function convidar(){ window.open('https://wa.me/?text='+encodeURIComponent('G Gratidão V81 '+location.href),'_blank'); }
function apoiar(){ alert('PIX bancogratidao.oficial@gmail.com'); }
function ia(){ alert('🤖 V81 FIX - Agora pasta Ação aparece e tem destino!'); }

render();
</script>
</body>
</html>
